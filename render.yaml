# Render blueprint: one public web service that serves the pages and the API.
#
#   Dashboard -> New -> Blueprint -> pick this repository
#
# JWT_SECRET is generated by Render and kept out of Git. The service starts
# with the bundled SQLite database and the demo accounts, so it works on the
# first deploy; switch the commented block on to move it to Supabase.

services:
  - type: web
    name: sams-scholarship-system
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: AUTH_PROVIDER
        value: local
      - key: STORAGE_BACKEND
        value: local
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO_ACCOUNTS
        value: true
      - key: UNIVERSITY_EMAIL_DOMAIN
        value: "@panpacificu.edu.ph"
      # PUBLIC_BASE_URL is optional: on Render it is derived from your
      # onrender.com address. Set it only when you attach a custom domain.
      # CORS_ORIGINS only matters when the pages are hosted on another origin.
      # --- Uncomment these to use Supabase instead of the bundled database ---
      # - key: AUTH_PROVIDER
      #   value: supabase
      # - key: STORAGE_BACKEND
      #   value: supabase
      # - key: SUPABASE_URL
      #   sync: false
      # - key: SUPABASE_ANON_KEY
      #   sync: false
      # - key: SUPABASE_SERVICE_KEY
      #   sync: false
      # - key: DATABASE_URL
      #   sync: false
      # - key: PASSWORD_RESET_REDIRECT
      #   sync: false
      # - key: SEED_DEMO_ACCOUNTS
      #   value: false
