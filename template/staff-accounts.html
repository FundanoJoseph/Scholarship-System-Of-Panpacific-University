<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Account Management - Panpacific University Scholarship System</title>
<link rel="icon" type="image/png" href="../assets/images/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
<link rel="stylesheet" href="../css/sidebar.css" />
<link rel="stylesheet" href="../css/staff-accounts.css" />
</head>
<body class="has-sidebar">

<div id="sidebar-placeholder"></div>

<main class="page-main">

  <div class="page-top">
    <div>
      <div class="eyebrow">Admin only</div>
      <h1>Account Management</h1>
      <p>Create and manage Authorized Staff and Admin accounts.</p>
    </div>
    <button type="button" class="btn btn-primary" id="openAddAccountBtn"><i class="ti ti-user-plus"></i> Create Staff/Admin account</button>
  </div>

  <div class="notice">
    <i class="ti ti-info-circle"></i>
    <span>Only students can register themselves. Staff and Admin accounts are created here by an Admin.</span>
  </div>

  <section class="card card-flush">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Full name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Created</th>
          </tr>
        </thead>
        <tbody id="accountRows"></tbody>
      </table>
    </div>
  </section>

</main>

<footer class="footer">&copy; Panpacific University &middot; Scholarship Portal</footer>


<div class="modal-overlay" id="addAccountModal">
  <div class="modal modal-sm">
    <div class="modal-heading">
      <h2><i class="ti ti-user-plus"></i> Create account</h2>
      <button type="button" class="close" data-close-modal aria-label="Close dialog"><i class="ti ti-x"></i></button>
    </div>

    <form id="addAccountForm" novalidate>
      <div class="alert alert-error" id="newAcctAlert"></div>

      <div class="form-group">
        <label for="newAcctName">Full name</label>
        <div class="input-wrap"><i class="ti ti-user"></i><input type="text" id="newAcctName" placeholder="e.g. Ramon Sicat" /></div>
        <p class="field-error" id="newAcctNameError"></p>
      </div>

      <div class="form-group">
        <label for="newAcctEmail">University email</label>
        <div class="input-wrap"><i class="ti ti-mail"></i><input type="email" id="newAcctEmail" placeholder="name@panpacificu.edu.ph" /></div>
        <p class="field-error" id="newAcctEmailError"></p>
      </div>

      <div class="form-group">
        <label for="newAcctRole">Role</label>
        <div class="input-wrap">
          <i class="ti ti-shield"></i>
          <select id="newAcctRole">
            <option value="staff">Authorized Staff</option>
            <option value="admin">Admin</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="newAcctPassword">Password</label>
        <div class="input-wrap"><i class="ti ti-lock"></i><input type="password" id="newAcctPassword" autocomplete="new-password" /></div>
        <p class="form-hint" id="newAcctHint"></p>
        <p class="field-error" id="newAcctPasswordError"></p>
      </div>

      <div class="form-group">
        <label for="newAcctConfirm">Confirm password</label>
        <div class="input-wrap"><i class="ti ti-lock"></i><input type="password" id="newAcctConfirm" autocomplete="new-password" /></div>
        <p class="field-error" id="newAcctConfirmError"></p>
      </div>

      <button type="submit" class="btn btn-primary btn-block"><i class="ti ti-device-floppy"></i> Create account</button>
    </form>
  </div>
</div>

<script src="../js/validation.js"></script>
<script src="../js/data.js"></script>
<script src="../js/common.js"></script>
<script src="../js/change-password.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/staff-accounts.js"></script>
</body>
</html>
